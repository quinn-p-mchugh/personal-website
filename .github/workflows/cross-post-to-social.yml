# Cross-posts new blog posts to Mastodon and Bluesky through Bridgy.
#
# What happens:
#   1. You commit a new post to main (from GitHub's web editor, your laptop,
#      anywhere) in one of the blog folders listed in the script's
#      BLOG_FOLDERS_TO_FEEDS setting.
#   2. This workflow waits for Vercel (or any host) to put it on the live site.
#   3. It tells Bridgy about the post. Bridgy formats and publishes it.
#   4. It saves the addresses of the new Mastodon and Bluesky posts into the
#      post's front matter ("syndication") and commits that, so the website
#      shows "Also on" links and Bridgy can send replies back (backfeed).
# The script that does the work, with plain-English notes, is
# .github/scripts/send_new_posts_to_bridgy.py
#
# GitHub Actions docs: https://docs.github.com/actions
# Bridgy docs: https://brid.gy/about

name: Cross-post to Mastodon and Bluesky

on:
  # Runs when a commit to main changes any folder whose name starts with
  # "blog" (blog/, blog-micro/, blog-ideas/, and any blog added later). Which
  # blogs are actually cross-posted is set in BLOG_FOLDERS_TO_FEEDS in the
  # script, so adding a blog is a one-line change there.
  # Docs: https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore
  push:
    branches: [main]
    paths:
      - "blog*/**"

  # Daily safety net, in case a push run failed (for example, a slow deploy).
  # Re-sends posts added in the last 3 days of commits; Bridgy skips any
  # already published, so nothing is posted twice. GitHub pauses scheduled
  # runs in a repository with no activity for 60 days; pushing a post, or
  # re-enabling the workflow on the Actions tab, turns it back on.
  # Docs: https://docs.github.com/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/disabling-and-enabling-a-workflow
  # Time is UTC (13:17 UTC is 8:17 or 9:17 in New York).
  # Docs: https://docs.github.com/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
  schedule:
    - cron: "17 13 * * *"

  # "Run workflow" button on the Actions tab.
  # Docs: https://docs.github.com/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
  workflow_dispatch:
    inputs:
      post_url:
        description: "One post's full address (its Mastodon and Bluesky addresses are saved too). Leave blank to send posts added in the last 3 days."
        required: false
        default: ""
      dry_run:
        description: "Dry run: only show what would be sent"
        type: boolean
        default: true

# Runs are allowed to overlap on purpose. A concurrency group would let
# GitHub cancel a queued run when a third push arrives, losing its posts, and
# overlap is harmless: Bridgy never publishes the same page twice.

# "write" lets step 4 commit the saved addresses. The token can only push
# to this repository, and pushes made with it don't start new workflow runs.
# Docs: https://docs.github.com/actions/security-for-github-actions/security-guides/automatic-token-authentication
permissions:
  contents: write

jobs:
  cross-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to an exact commit, so a changed or compromised tag can't
      # alter what runs with write access; the comment says which release.
      # Docs: https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
      - name: Get the repository's files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Find post files that were added
        if: github.event_name != 'workflow_dispatch' || inputs.post_url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Lists files whose status is "added". Edits to existing posts are
          # ignored on purpose. Uses GitHub's API, so no git history is needed.
          # --paginate fetches every page, so large pushes aren't cut short.
          # Docs: https://docs.github.com/rest/commits/commits
          set -euo pipefail
          ADDED='.files[]? | select(.status=="added") | .filename'
          added_in_commit() { gh api --paginate "repos/$REPO/commits/$1" --jq "$ADDED"; }
          if [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A force-push can make the previous commit unknown to GitHub;
            # fall back to the files of the newest commit.
            gh api --paginate "repos/$REPO/compare/$BEFORE...$AFTER" --jq "$ADDED" > added.txt \
              || added_in_commit "$AFTER" > added.txt
          elif [ "$EVENT" = "push" ]; then
            added_in_commit "$AFTER" > added.txt
          else
            since=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
            : > added.txt
            for sha in $(gh api --paginate "repos/$REPO/commits?sha=main&since=$since&per_page=100" --jq '.[].sha'); do
              added_in_commit "$sha" >> added.txt
            done
          fi
          sort -u -o added.txt added.txt
          echo "Added files:"; cat added.txt

      - name: Send new posts to Bridgy
        if: github.event_name != 'workflow_dispatch'
        run: |
          mapfile -t files < added.txt
          python3 .github/scripts/send_new_posts_to_bridgy.py --record-syndication --new-files "${files[@]}"

      - name: Send posts to Bridgy (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          POST_URL: ${{ inputs.post_url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$POST_URL" ]; then
            args=(--url "$POST_URL")
          else
            mapfile -t files < added.txt
            args=(--new-files "${files[@]}")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); else args+=(--record-syndication); fi
          python3 .github/scripts/send_new_posts_to_bridgy.py "${args[@]}"

      - name: Commit the saved Mastodon and Bluesky addresses
        # Runs even if some posts failed, so addresses already saved aren't
        # lost, but only on main, so a manual run from another branch can't
        # push that branch's commits to main.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- ':(glob)blog*/**')" ]; then
            echo "No addresses to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)blog*/**'
          git commit -m "Save where new posts were cross-posted"
          # Someone may have pushed meanwhile: replay on top and try again.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then
              echo "Saved and pushed."
              exit 0
            fi
            # A failed rebase (say, the same post edited meanwhile) leaves git
            # mid-rebase; undo it so the next attempt starts clean.
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "::error::Could not push the saved addresses. They will be missing from the posts' front matter."
          exit 1
