# Runs the cross-posting plugin's tests whenever it changes, so a broken
# change shows a red X on the pull request before it reaches main.
#
# What's tested: plugins/docusaurus-plugin-crosspost, with Node's built-in
# test runner (plugins/docusaurus-plugin-crosspost/test/).
# Run the same tests locally with: npm test
#
# GitHub Actions docs: https://docs.github.com/actions

name: Test cross-posting code

on:
  pull_request:
    # Keep both lists the same.
    paths:
      - ".github/workflows/test-social-posts.yml"
      - ".github/workflows/cross-post-to-social.yml"
      - "plugins/docusaurus-plugin-crosspost/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-social-posts.yml"
      - ".github/workflows/cross-post-to-social.yml"
      - "plugins/docusaurus-plugin-crosspost/**"
      - "package.json"
      - "package-lock.json"
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:

# Read-only: the tests change nothing.
# Docs: https://docs.github.com/actions/security-for-github-actions/security-guides/automatic-token-authentication
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to an exact commit, so a changed or compromised
      # tag can't alter what runs; the comment says which release it is.
      # Docs: https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
      - name: Get the repository's files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # The hashtag tests read tags files with Docusaurus's own code, so the
      # site's packages are needed, exactly as listed in package-lock.json.
      # Docs: https://docs.npmjs.com/cli/commands/npm-ci
      - name: Install the site's packages
        run: npm ci --no-audit --no-fund

      - name: Run the tests
        run: npm test
