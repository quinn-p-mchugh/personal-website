# Checks the writing in each pull request with Vale (https://vale.sh), a
# prose linter, using the styles in .vale.ini.
#
# To keep it useful rather than noisy, it:
#   - only checks Markdown files (.md, .mdx) that the pull request changes;
#   - only flags lines the pull request adds or edits, not older writing;
#   - only shows error-level alerts (spelling, typos, wording errors), not
#     style suggestions;
#   - never blocks a merge: alerts show as notes next to the lines on the
#     pull request's "Files changed" tab.
#
# Run it on your computer (after installing Vale: https://vale.sh/docs/install):
#   vale path/to/file.md
#
# Vale action docs: https://github.com/errata-ai/vale-action

name: Check the writing

on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"

# Read the files and write notes on the pull request; nothing else.
# Docs: https://docs.github.com/actions/security-for-github-actions/security-guides/automatic-token-authentication
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: check-writing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to an exact commit; the comment says which release.
      - name: Get the repository's files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history, to compare with the base branch

      # Vale is slow on whole folders full of images, so it gets just the
      # changed Markdown files, as a JSON list.
      - name: List the changed Markdown files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- '*.md' '*.mdx')
          echo "Changed Markdown files:"
          echo "${files:-  (none)}"
          json=$(printf '%s\n' "$files" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "files=$json" >> "$GITHUB_OUTPUT"

      # continue-on-error: the notes still appear on the pull request, but
      # alerts never turn the check red (the action's fail_on_error setting
      # alone doesn't cover reviewdog's exit status).
      - name: Check the writing with Vale
        if: steps.changed.outputs.files != '[]'
        continue-on-error: true
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          files: ${{ steps.changed.outputs.files }}
          vale_flags: "--minAlertLevel=error"
          filter_mode: added
          fail_on_error: false
